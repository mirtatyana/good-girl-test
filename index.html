<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5f0">
<meta name="description" content="Хорошая девочка. А где в этой истории вы? 12 вопросов для женщин 40+. Татьяна Мировская, психолог.">
<title>Хорошая девочка — тест | Татьяна Мировская, психолог</title>
<style>
:root{--bg:#f8f5f0;--paper:#fffefa;--ink:#302c2c;--muted:#786f70;--wine:#824d58;--wine-dark:#673943;--line:#e7dfd9;--soft:#f2e9e6;--gold:#b79a78}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Helvetica Neue',sans-serif;line-height:1.6}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 100% 0%,#eee1dd 0,transparent 42%),radial-gradient(ellipse at 0% 100%,#eee9e2 0,transparent 45%);opacity:.8}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #c49ca6;outline-offset:3px}.shell{max-width:850px;margin:auto;padding:28px 22px 50px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:48px}.brand{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.brand span{display:block;font-size:11px;font-weight:400;letter-spacing:.14em;color:var(--muted);margin-top:4px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--wine);font-weight:700}.ornament{font-family:Georgia,serif;color:var(--gold);font-size:26px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px rgba(71,45,44,.06);padding:clamp(25px,6vw,62px);position:relative;overflow:hidden}.card:before{content:"";position:absolute;right:-45px;top:-48px;width:170px;height:170px;border:1px solid #eadbd5;border-radius:50%;pointer-events:none}.card>*{position:relative}.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400;line-height:1.13;letter-spacing:-.035em}h1{font-size:clamp(43px,7.8vw,72px);margin:20px 0 24px}h2{font-size:clamp(29px,5vw,43px);margin:16px 0 22px}h3{font-family:Georgia,serif;font-weight:400;font-size:25px;line-height:1.25;margin:0 0 14px}.lead{font-size:clamp(17px,2.6vw,20px);max-width:560px;line-height:1.7}.muted{color:var(--muted)}.fine{font-size:13px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:30px 0}.btn{border:0;border-radius:100px;padding:16px 24px;font-size:15px;font-weight:700;display:inline-flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;transition:transform .2s,background .2s;min-height:52px}.btn:hover{transform:translateY(-2px)}.primary{background:var(--wine);color:white}.primary:hover{background:var(--wine-dark)}.secondary{background:transparent;color:var(--wine);border:1px solid #bd9da4}.quiet{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.meta{display:flex;gap:22px;flex-wrap:wrap;margin:26px 0 34px;font-size:13px;color:var(--muted)}.meta span:before{content:'✦';color:var(--gold);margin-right:9px}.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:12px}.track{height:5px;background:#eee5e0;border-radius:20px;overflow:hidden;margin-bottom:34px}.fill{height:100%;background:var(--wine);transition:width .2s}.options{display:grid;gap:12px;margin:32px 0}.option{display:flex;gap:15px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);padding:18px 20px;border-radius:15px;color:var(--ink);font-size:16px}.option:hover{border-color:#c4a4aa}.option[aria-pressed=true]{background:var(--soft);border-color:var(--wine)}.dot{width:20px;height:20px;border:1.5px solid #b7a5a3;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.option[aria-pressed=true] .dot{border-color:var(--wine)}.option[aria-pressed=true] .dot:after{content:"";width:10px;height:10px;background:var(--wine);border-radius:50%}.nav{display:flex;gap:12px;justify-content:space-between}.nav .next{flex:1}.score{font-family:Georgia,serif;font-size:76px;line-height:1;color:var(--wine)}.score small{font-family:Arial,sans-serif;font-size:16px;color:var(--muted)}.result-heading{font-family:Georgia,serif;font-size:clamp(29px,5vw,40px);font-weight:400;line-height:1.2}.area{padding:15px 0;border-bottom:1px solid var(--line)}.area:last-child{border:0}.area .n{font-size:11px;color:var(--wine);text-transform:uppercase;letter-spacing:.08em}.callout{background:#f5eeea;border-left:3px solid var(--wine);padding:22px 25px;margin:26px 0;border-radius:0 14px 14px 0;font-family:Georgia,serif;font-size:21px;line-height:1.45}.actions{display:grid;gap:12px;margin-top:22px}.actions .btn{width:100%;text-align:center}.footer{text-align:center;margin:34px 0 0;font-size:12px;color:var(--muted)}.footer a{color:var(--wine)}.hidden{display:none!important}.back-link{border:0;background:transparent;color:var(--muted);padding:0;text-decoration:underline;text-underline-offset:4px}.spark{color:var(--gold);font-size:24px}.note{background:#f8f3f0;padding:18px 20px;border-radius:14px;margin:24px 0;font-size:14px}.end-signature{font-family:Georgia,serif;font-style:italic;color:var(--wine);font-size:20px;margin-top:25px}@media(max-width:580px){.shell{padding:20px 14px 34px}.top{margin-bottom:26px}.card{border-radius:19px;padding:28px 22px}.nav{gap:8px}.btn{padding:14px 16px;font-size:14px}.meta{gap:10px 20px}h1{font-size:46px}.score{font-size:65px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="brand">Татьяна Мировская<span>Психолог</span></div><div class="ornament" aria-hidden="true">✳</div></header><div id="app" aria-live="polite"></div><footer class="footer">© Татьяна Мировская · Психолог<br>Этот тест — упражнение для самонаблюдения, а не психологическая диагностика.</footer></main>
<script>
'use strict';
const GUIDE='https://disk.yandex.ru/d/4jL9WUQD3mdW8A';
// При получении проверенной прямой ссылки на диалог ВК замените адрес ниже.
const CONSULT='https://vk.ru/mirovskaya';
const questions=[
'Вы запланировали выходной для себя, но близкие предложили другие планы. Вам проще уступить, чем объяснять, почему вы хотите иначе?',
'Когда мама, муж или взрослые дети недовольны вашим решением, вы начинаете сомневаться, правильно ли поступили?',
'Вы соглашаетесь помочь, хотя уже устали или своих дел невпроворот, а потом злитесь, что вас опять нагрузили?',
'Получив дорогой подарок или неожиданную заботу, вы начинаете думать, чем теперь ответить или как это заслужить?',
'Вам нужна помощь, но вы сначала думаете, насколько это удобно другому человеку, и часто делаете всё сами?',
'На вопрос, куда поехать или где поужинать, вы отвечаете «мне всё равно», хотя предпочтения у вас есть?',
'После неприятного разговора вы долго прокручиваете его в голове, думая, не обидели ли человека?',
'Вам трудно спокойно отдыхать, пока остаются незавершённые домашние дела?',
'Отказывая в просьбе, вы долго объясняете причины, чтобы человек точно не обиделся?',
'Вы предпочитаете промолчать о том, что вас задело, лишь бы не возникло напряжения?',
'Вы делаете для близких то, о чём они не просили, а потом расстраиваетесь, что это не оценили?',
'Принимая решение в свою пользу, вы стараетесь убедиться, что никто не расстроится и не подумает о вас плохо?'
];
const areas=['Ваше личное время и планы','Уверенность в своём выборе','Силы и право на отдых','Радость принимать любовь и заботу','Возможность получать поддержку','Ваши желания и предпочтения','Спокойствие после конфликтов','Отдых без чувства вины','Право отказывать без оправданий','Открытость и близость в отношениях','Энергия и взаимность','Свобода жить по-своему'];
const titles=['Вы чаще позволяете себе быть собой','Вы умеете выбирать себя. Но не всегда разрешаете','Быть хорошей для вас — серьёзная работа'];
const descriptions=[
'Во многих ситуациях вы способны учитывать собственные интересы. Но это не значит, что во всех отношениях вам одинаково легко быть собой. Посмотрите на вопросы, где вы поставили два балла. Возможно, с коллегами вы свободны, а рядом с мамой всё ещё боитесь её расстроить.',
'Вы можете сказать «нет», попросить о помощи и настоять на своём. Но иногда за это приходится платить чувством вины, внутренним напряжением или долгими объяснениями. Подумайте, сколько сил уходит не на само решение, а на переживания после него.',
'Похоже, вы часто проверяете, не расстроили ли кого-то. Важно заметить не только усталость. Сколько ваших желаний так и не стали планами? Сколько разговоров не состоялось? Сколько возможностей вы даже не стали рассматривать, потому что кому-то это могло не понравиться?'
];
let answers=Array(12).fill(null),step=-1;
const app=document.getElementById('app');
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
function renderIntro(){app.innerHTML=`<section class="card"><div class="eyebrow">Тест для женщин 40+ · 12 вопросов</div><h1 class="serif">Хорошая девочка.<br>А где в этой истории вы?</h1><p class="lead">Вам уже давно не пять лет. Но легко ли вам сказать «нет», попросить о помощи или позволить близкому человеку остаться недовольным?</p><p class="muted">Предлагаю посмотреть, сколько места в вашей жизни занимают чужие ожидания. И что остаётся для вас самой.</p><div class="meta"><span>Около 4 минут</span><span>Без регистрации</span><span>Результат сразу</span></div><button class="btn primary" id="start">Начать тест <span aria-hidden="true">→</span></button><div class="divider"></div><p class="fine">Отвечайте не так, как считаете правильным, а так, как обычно поступаете в реальной жизни. Здесь нет хороших и плохих ответов.</p></section>`;document.getElementById('start').onclick=()=>{step=0;renderQuestion()}}
function renderQuestion(){const i=step;app.innerHTML=`<section class="card"><div class="progress-head"><span>Вопрос ${i+1} из 12</span><span>${Math.round(i/12*100)}%</span></div><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${i}"><div class="fill" style="width:${i/12*100}%"></div></div><div class="eyebrow">Представьте обычную ситуацию</div><h2 class="serif">${questions[i]}</h2><div class="options" role="group" aria-label="Выберите, как часто это происходит">${['Почти никогда','Иногда','Часто'].map((v,k)=>`<button type="button" class="option" data-answer="${k}" aria-pressed="${answers[i]===k}"><span class="dot"></span>${v}</button>`).join('')}</div><div class="nav"><button class="btn quiet" id="back">← Назад</button><button class="btn primary next" id="next" ${answers[i]===null?'disabled':''}>${i===11?'Посмотреть результат':'Далее →'}</button></div></section>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[i]=Number(b.dataset.answer);renderQuestion()});document.getElementById('back').onclick=()=>{step--;step<0?renderIntro():renderQuestion();scrollTop()};document.getElementById('next').onclick=()=>{if(answers[i]===null)return;if(i===11)renderResult();else{step++;renderQuestion()}scrollTop()}}
function renderResult(){if(answers.some(x=>x===null))return;const score=answers.reduce((a,b)=>a+b,0),level=score<=6?0:score<=15?1:2;const selected=answers.map((v,i)=>({v,i})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);app.innerHTML=`<section class="card"><div class="eyebrow">Ваш результат</div><div class="score">${score} <small>из 24 баллов</small></div><h2 class="result-heading">${titles[level]}</h2><p class="lead">${descriptions[level]}</p><div class="divider"></div><div class="eyebrow">Ваши зоны для размышления</div>${selected.length?selected.map(x=>`<div class="area"><div class="n">Вопрос ${x.i+1} · ${x.v===2?'Часто':'Иногда'}</div><div>${areas[x.i]}</div></div>`).join(''):'<p>В ваших ответах нет часто повторяющихся затруднений. Подумайте, в каких отношениях вам всё-таки бывает сложно поступать по-своему.</p>'}<div class="callout">А что я теряю, когда поступаю именно так? Время? Отдых? Возможность попросить о помощи? Или постепенно — понимание того, чего хочу сама?</div><p>Не нужно становиться плохой девочкой. Возможно, достаточно перестать каждый раз доказывать, что вы хорошая.</p><div class="divider"></div><h3>Что дальше?</h3><p class="muted">Можно начать с маленьких шагов самостоятельно. А можно разобраться с тем, что повторяется годами, в индивидуальной работе.</p><div class="actions"><a class="btn primary" href="${GUIDE}" target="_blank" rel="noopener noreferrer">Получить бесплатный гайд ↗</a><a class="btn secondary" href="${CONSULT}" target="_blank" rel="noopener noreferrer">Записаться на консультацию ↗</a><button class="btn quiet" id="restart">Пройти тест ещё раз</button></div><div class="note">Этот результат не является диагнозом или профессиональным заключением. Баллы условные: важнее конкретные ситуации, которые заставили вас задуматься.</div><div class="end-signature">Татьяна Мировская, психолог</div></section>`;document.getElementById('restart').onclick=()=>{answers=Array(12).fill(null);step=-1;renderIntro();scrollTop()}}
renderIntro();
</script></body></html>
